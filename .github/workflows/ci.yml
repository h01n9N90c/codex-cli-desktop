# Project   : Codex Dual-Lane & Security Kit
#
# Runs automated security, syntax, hygiene, and deterministic rollback checks
# across Ubuntu, macOS, and Windows (both PowerShell 5.1 and PowerShell 7+):
#   1. hygiene-and-policy (ubuntu-latest):
#        - Line-ending & BOM enforcement per .gitattributes
#        - Secret, API-key, and personal/private-path leak scanner
#        - Forbidden tracked artifact guard (__pycache__, auth.json, config.toml)
#        - Starlark AST & core policy check on templates/default.rules
#        - Python syntax compilation (py_compile)
#   2. test-windows (windows-latest):
#        - Full 13-stage tests/test-kit.ps1 under Windows PowerShell 5.1 AND PowerShell 7+
#        - Covers AST parse, Python unittest, default.rules, -DryRun/-WhatIf,
#          non-destructive TOML merge, env_key secret isolation, Protect-SensitiveFileAcl,
#          8.3 short-path canonicalization, hard fail-closed worktree isolation,
#          doctor.ps1 zero-leakage/bypass checks, path-traversal rejection,
#          SHA-256 rollback, interrupted mid-install recovery, 3x install/rollback loop,
#          trust-boundary preservation, and codex-manager.ps1 (all 6 actions + rescue).
#   3. test-unix (ubuntu-latest & macos-latest):
#        - bash -n syntax validation on all 4 scripts/*.sh (including codex-manager.sh)
#        - py_compile + python3 -B -m unittest discover -s ./tests -v
#        - Portable end-to-end smoke test (paths with spaces, --dry-run zero-mutation,
#          TOML merge preservation, 0600 permissions, hard fail-closed worktree routing
#          & failed-cd/missing-worktree refusal, doctor.sh zero-secret-leakage,
#          tampered path-traversal/SUID manifest rejection, SHA-256 + POSIX mode rollback,
#          interrupted mid-install rollback recovery, 3x install/rollback loop,
#          trust-boundary parity, and Section 10 codex-manager.sh all 6 actions + rescue).
# ==============================================================================
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  hygiene-and-policy:
    name: Repository Hygiene, Line Endings, Secret Scan & Rules AST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # WHAT: Validates exact line endings (LF vs CRLF per .gitattributes), UTF-8
      #       BOM hygiene, tracked-file allowlist (no __pycache__/secrets), and
      #       LICENSE/NOTICE presence.
      # PREVENTS: Broken Unix shebangs from CRLF, broken PS 5.1 CRLF contracts,
      #           or accidentally committed credentials/bytecode caches.
      - name: Verify .gitattributes line endings, BOM & repo hygiene
        run: |
          python3 -B - <<'PY'
          import pathlib, subprocess, sys

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode("utf-8").split("\x00")
          tracked = [p for p in tracked if p]
          assert tracked, "git ls-files returned empty repository"

          # Verify legal attribution & core manager scripts remain tracked and non-empty.
          for req in ("LICENSE", "NOTICE", "scripts/codex-manager.sh", "scripts/codex-manager.ps1"):
              p = pathlib.Path(req)
              assert p.is_file() and p.stat().st_size > 0, f"Required file missing or empty: {req}"
              assert req in tracked, f"Required file is not tracked by git: {req}"

          # Reject forbidden tracked artifacts (bytecode caches, live configs, secrets, DBs).
          forbidden_names = {"auth.json", "config.toml", "config.backup.toml", ".env"}
          forbidden_suffixes = (".pyc", ".pyo", ".sqlite", ".sqlite-wal", ".sqlite-shm", ".key", ".pem")
          errors = []
          for rel in tracked:
              parts = pathlib.PurePosixPath(rel).parts
              name = parts[-1]
              if "__pycache__" in parts or name in forbidden_names or name.startswith(".env.") or rel.endswith(forbidden_suffixes):
                  errors.append(f"Forbidden tracked file: {rel}")
                  continue

              data = pathlib.Path(rel).read_bytes()
              is_crlf_type = rel.endswith((".ps1", ".cmd"))
              is_lf_type = (
                  rel.endswith((".sh", ".py", ".md", ".rules", ".yml", ".yaml"))
                  or name in {"LICENSE", "NOTICE", ".gitattributes", ".gitignore"}
              )

              if is_crlf_type:
                  if data.startswith(b"\xef\xbb\xbf"):
                      errors.append(f"UTF-8 BOM not permitted in CRLF-enforced file: {rel}")
                  # Every LF in .ps1/.cmd must be preceded by CR (strict CRLF per .gitattributes).
                  for i, b in enumerate(data):
                      if b == 0x0A and (i == 0 or data[i - 1] != 0x0D):
                          errors.append(f"Lone LF found in CRLF-enforced file: {rel}")
                          break
              elif is_lf_type:
                  if data.startswith(b"\xef\xbb\xbf"):
                      errors.append(f"UTF-8 BOM not permitted in LF-enforced file: {rel}")
                  if b"\r" in data:
                      errors.append(f"CR/CRLF byte found in LF-enforced file: {rel}")

          if errors:
              for err in errors:
                  print(f"[FAIL] {err}", file=sys.stderr)
              sys.exit(1)
          print(f"[PASS] Line endings, BOM, and artifact hygiene verified across {len(tracked)} tracked files.")
          PY

      # WHAT: Scans all tracked files for accidentally committed API keys, private keys,
      #       or non-placeholder local home paths (e.g., personal C:\Users\<name> paths).
      # PREVENTS: Credential leaks or private workstation path disclosure in public PRs.
      - name: Scan tracked files for leaked secrets & private paths
        run: |
          python3 -B - <<'PY'
          import pathlib, re, subprocess, sys

          tracked = [p for p in subprocess.check_output(["git", "ls-files", "-z"]).decode("utf-8").split("\x00") if p]

          # Build patterns from pieces so this workflow step never self-matches its own regex text.
          secret_patterns = [
              ("OpenAI-style secret key", re.compile(r"\b" + r"sk-" + r"[A-Za-z0-9_-]{20,}\b")),
              ("GitHub PAT", re.compile(r"\b" + r"gh[po]_" + r"[A-Za-z0-9]{20,}\b")),
              ("AWS Access Key ID", re.compile(r"\b" + r"AKIA" + r"[0-9A-Z]{16}\b")),
              ("Slack token", re.compile(r"\b" + r"xox[baprs]-" + r"[A-Za-z0-9-]{10,}\b")),
              ("Private key header", re.compile(r"-----BEGIN " + r"[A-Z ]*PRIVATE KEY-----")),
          ]
          # Synthetic test/doc placeholders allowed in tests/ and docs/
          placeholder_re = re.compile(r"(CANARY|LEGACY|EXAMPLE|PLACEHOLDER|YOUR|REDACTED|DUMMY|FAKE|TEST)", re.IGNORECASE)

          # Detect personal Windows/macOS/Linux user-profile paths while permitting generic placeholders.
          home_path_re = re.compile(r"(?:[A-Za-z]:\\+Users\\+|/Users/|/home/)([A-Za-z0-9._-]+)")
          allowed_usernames = {
              "user", "username", "yourname", "youruser", "your-user", "your_user",
              "you", "alice", "bob", "example", "runner", "runneradmin", "dev", "me",
          }

          findings = []
          for rel in tracked:
              text = pathlib.Path(rel).read_text(encoding="utf-8-sig", errors="replace")
              for lineno, line in enumerate(text.splitlines(), 1):
                  for label, pat in secret_patterns:
                      for match in pat.finditer(line):
                          if placeholder_re.search(match.group(0)):
                              continue
                          findings.append(f"{rel}:{lineno}: potential {label}")
                  for match in home_path_re.finditer(line):
                      uname = match.group(1)
                      if uname.lower() in allowed_usernames:
                          continue
                      findings.append(f"{rel}:{lineno}: potential personal home path segment ({uname!r})")

          if findings:
              for f in findings:
                  print(f"[FAIL] {f}", file=sys.stderr)
              sys.exit(1)
          print(f"[PASS] Secret & private-path leak scan clean across {len(tracked)} tracked files.")
          PY

      # WHAT: Parses templates/default.rules as Starlark/Python AST and compiles all
      #       Python files to bytecode (without persisting __pycache__).
      # PREVENTS: Malformed execpolicy rules or Python syntax regressions.
      - name: Validate templates/default.rules AST & compile Python scripts
        run: |
          python3 -B - <<'PY'
          import ast, pathlib, py_compile, tempfile

          with tempfile.TemporaryDirectory() as td:
              py_compile.compile("scripts/sync-sessions.py", cfile=str(pathlib.Path(td) / "sync_sessions.pyc"), doraise=True)
              py_compile.compile("tests/test_sync_sessions.py", cfile=str(pathlib.Path(td) / "test_sync_sessions.pyc"), doraise=True)

          rules_path = pathlib.Path("templates/default.rules")
          tree = ast.parse(rules_path.read_text(encoding="utf-8"), filename=str(rules_path))
          assert len(tree.body) > 0, "templates/default.rules has zero rules"
          rules = {}
          for stmt in tree.body:
              assert isinstance(stmt, ast.Expr) and isinstance(stmt.value, ast.Call)
              call = stmt.value
              assert isinstance(call.func, ast.Name) and call.func.id == "prefix_rule"
              assert not call.args
              kw = {k.arg: ast.literal_eval(k.value) for k in call.keywords}
              assert set(kw.keys()) == {"pattern", "decision"}
              assert isinstance(kw["pattern"], list) and kw["pattern"] and all(isinstance(x, str) and x for x in kw["pattern"])
              assert kw["decision"] in {"forbidden", "prompt", "allow"}
              rules[tuple(kw["pattern"])] = kw["decision"]

          for req_forbid in (("vssadmin",), ("icacls",), ("php",), ("mshta",), ("Start-Process",), ("iex",), ("git", "push", "--force")):
              assert rules.get(req_forbid) == "forbidden", f"Missing forbidden rule: {req_forbid}"
          for req_prompt in (("git", "push"), ("git", "reset", "--hard"), ("git", "clean")):
              assert rules.get(req_prompt) == "prompt", f"Missing prompt rule: {req_prompt}"
          print(f"[PASS] Python syntax & templates/default.rules AST validated ({len(rules)} rules).")
          PY

  test-windows:
    name: Windows PowerShell (5.1 & 7+) & Python Safety Suite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # WHAT: Syntax-checks Python sources prior to running the full Windows harness.
      - name: Compile Python scripts (py_compile)
        shell: powershell
        run: |
          python -B -m py_compile .\scripts\sync-sessions.py .\tests\test_sync_sessions.py

      # WHAT: Runs full 10-stage test-kit.ps1 under Windows PowerShell 5.1 (default OS shell).
      # PREVENTS: PS 5.1 strict-mode, BOM, encoding, 8.3 short-path, ACL, TOML, worktree, or rollback regressions.
      - name: Run Full Security & Rollback Test Suite (Windows PowerShell 5.1)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\test-kit.ps1

      # WHAT: Re-runs full 10-stage test-kit.ps1 under PowerShell 7+ (pwsh).
      # PREVENTS: Cross-version PowerShell 7 incompatibilities.
      - name: Run Full Security & Rollback Test Suite (PowerShell 7+)
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\tests\test-kit.ps1

  test-unix:
    name: Unix Safety Suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # WHAT: Validates Bash syntax on all .sh scripts, compiles Python, and executes
      #       the full Python unit & adversarial safety suite (including real symlinks).
      # PREVENTS: Bash 3.2 (macOS) / Bash 5 (Linux) syntax errors and sync-sessions regressions.
      - name: Verify Bash syntax, py_compile & Python unit tests
        run: |
          bash -n ./scripts/setup-dual-lane.sh
          bash -n ./scripts/doctor.sh
          bash -n ./scripts/restore-original.sh
          bash -n ./scripts/codex-manager.sh
          python3 -B -m py_compile ./scripts/sync-sessions.py ./tests/test_sync_sessions.py
          python3 -B -m unittest discover -s ./tests -v

      # WHAT: End-to-end safety smoke test on both Linux and macOS inside a path with spaces:
      #       --dry-run zero-mutation, non-destructive TOML merge (top-level + sections),
      #       0600 permissions, hard fail-closed worktree routing (deleted worktree &
      #       failed cd refusal, CODEX_NO_AUTO_WORKTREE_CD=1 opt-out with -C/--cd/--add-dir
      #       still blocked), doctor.sh zero-secret-leakage, tampered traversal/SUID manifest
      #       rejection, restore --dry-run, SHA-256 + exact POSIX mode rollback, interrupted
      #       mid-install recovery, and 3x repeated install/rollback loop.
      # PREVENTS: Linux/macOS portability bugs (GNU vs BSD stat/sed/shasum/mktemp),
      #           silent primary-repo fallback, symlink traversal escapes, permission
      #           regressions, partial-install corruption, and Lane 1 data loss.
      - name: Run Unix installer, fail-closed worktree, interrupted rollback & 3x loop smoke test
        shell: bash
        run: |
          set -euo pipefail
          sha256_of() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum < "$1" | awk '{print tolower($1)}'
            else
              shasum -a 256 < "$1" | awk '{print tolower($1)}'
            fi
          }

          TMP_ROOT="$(mktemp -d 2>/dev/null || mktemp -d -t codex-kit-ci)"
          P10_MOCK_PID=""
          cleanup_tmp() {
            if [ -n "${P10_MOCK_PID:-}" ]; then
              kill "${P10_MOCK_PID}" 2>/dev/null || true
            fi
            chmod -R u+rwx "${TMP_ROOT}" 2>/dev/null || true
            rm -rf "${TMP_ROOT}"
          }
          trap cleanup_tmp EXIT

          WORK_DIR="${TMP_ROOT}/my workspace"
          REPO_DIR="${WORK_DIR}/my repo"
          FAKE_BIN="${WORK_DIR}/fake bin"
          LANE1="${WORK_DIR}/lane1"
          LANE2="${WORK_DIR}/lane2"
          LOCAL_BIN="${WORK_DIR}/local bin"
          OUTSIDE_VICTIM="${TMP_ROOT}/outside_victim.txt"
          EXEC_SENTINEL="${TMP_ROOT}/fake-codex-executed.flag"

          mkdir -p "${REPO_DIR}/src/sub dir" "${FAKE_BIN}" "${LANE1}/sessions" "${LANE2}" "${LOCAL_BIN}"
          git -C "${REPO_DIR}" init -q
          git -C "${REPO_DIR}" config user.email "ci@example.invalid"
          git -C "${REPO_DIR}" config user.name "CI"
          echo "repo-init" > "${REPO_DIR}/src/sub dir/app.txt"
          git -C "${REPO_DIR}" add .
          git -C "${REPO_DIR}" commit -q -m "init"

          echo '{"id":"s1"}' > "${LANE1}/sessions/keep.jsonl"
          SESSION_HASH="$(sha256_of "${LANE1}/sessions/keep.jsonl")"
          echo 'DO_NOT_DELETE' > "${OUTSIDE_VICTIM}"
          VICTIM_HASH="$(sha256_of "${OUTSIDE_VICTIM}")"
          printf '#!/usr/bin/env bash\necho PRE_EXISTING_UNIX_LAUNCHER\n' > "${LOCAL_BIN}/codex-t3"
          # Deliberately use 755 (not 700) to verify rollback preserves exact pre-existing POSIX mode.
          chmod 755 "${LOCAL_BIN}/codex-t3"
          ORIG_LAUNCHER_HASH="$(sha256_of "${LOCAL_BIN}/codex-t3")"

          cat > "${FAKE_BIN}/codex" <<'EOF'
          #!/usr/bin/env bash
          if [ -n "${CODEX_TEST_SENTINEL:-}" ]; then
            printf 'RAN:%s\n' "$*" >> "${CODEX_TEST_SENTINEL}"
          fi
          if [ "${1:-}" = "--version" ]; then echo "codex-cli 0.171.0-ci"; exit 0; fi
          if [ "${1:-}" = "features" ]; then echo "memories stable true"; exit 0; fi
          if [ "${1:-}" = "execpolicy" ]; then echo '{"decision":"forbidden"}'; exit 0; fi
          if [ "${1:-}" = "pwd-check" ]; then pwd -P; exit 0; fi
          exit 0
          EOF
          chmod +x "${FAKE_BIN}/codex"

          cat > "${LANE2}/config.toml" <<'EOF'
          model = "custom-ci-model"

          [mcp_servers.custom_ci]
          command = "node"
          EOF
          # Deliberately use 644 (not 600) to verify rollback restores exact original config.toml mode.
          chmod 644 "${LANE2}/config.toml"
          ORIG_HASH="$(sha256_of "${LANE2}/config.toml")"

          SECRET_CANARY="sk-CANARY-UNIX-DOCTOR-NEVER-ECHO-991122"
          printf '{"auth_mode":"chatgpt","token":"%s"}\n' "${SECRET_CANARY}" > "${LANE2}/auth.json"
          chmod 600 "${LANE2}/auth.json"

          # 1) --dry-run must perform zero disk mutations (including zero .rollback journal creation).
          PATH="${FAKE_BIN}:${PATH}" \
          CODEX_LANE1_HOME="${LANE1}" \
          CODEX_LANE2_HOME="${LANE2}" \
          CODEX_LOCAL_BIN="${LOCAL_BIN}" \
          ./scripts/setup-dual-lane.sh --repo "${REPO_DIR}" --use-git-worktree --install-bridge --dry-run
          [ "$(sha256_of "${LANE2}/config.toml")" = "${ORIG_HASH}" ]
          [ ! -e "${LOCAL_BIN}/codex" ]
          [ ! -L "${LANE2}/sessions" ]
          [ ! -d "${REPO_DIR}-lane2" ]
          [ ! -e "${LANE2}/.rollback" ]

          # 2) Full install with --use-git-worktree preserves top-level keys & custom sections,
          #    enforces 0600 while live, creates complete 5-col manifest, and routes subdirs + blocks -C primary.
          PATH="${FAKE_BIN}:${PATH}" \
          CODEX_LANE1_HOME="${LANE1}" \
          CODEX_LANE2_HOME="${LANE2}" \
          CODEX_LOCAL_BIN="${LOCAL_BIN}" \
          ./scripts/setup-dual-lane.sh --repo "${REPO_DIR}" --use-git-worktree --install-bridge

          grep -q 'approval_policy = "on-request"' "${LANE2}/config.toml"
          grep -q 'network_access = false' "${LANE2}/config.toml"
          grep -q 'model = "custom-ci-model"' "${LANE2}/config.toml"
          grep -q '\[mcp_servers\.custom_ci\]' "${LANE2}/config.toml"
          [ -f "${LANE2}/.rollback/latest.tsv" ]
          grep -q '^# status=complete$' "${LANE2}/.rollback/latest.tsv"
          python3 -B -c 'import os, stat, sys; assert stat.S_IMODE(os.stat(sys.argv[1]).st_mode) == 0o600' "${LANE2}/config.toml"

          # Verify nested subdirectory switches to matching worktree subdirectory & -C/--cd/--add-dir fails closed
          # WITHOUT executing fake codex.
          WT_SUB_CWD="$(cd "${REPO_DIR}/src/sub dir" && "${LOCAL_BIN}/codex" pwd-check)"
          case "${WT_SUB_CWD}" in
            *-lane2/src/sub\ dir) ;;
            *) echo "[FAIL] Expected worktree subdir, got ${WT_SUB_CWD}" >&2; exit 1 ;;
          esac
          rm -f "${EXEC_SENTINEL}"
          if CODEX_TEST_SENTINEL="${EXEC_SENTINEL}" "${LOCAL_BIN}/codex" -C "${REPO_DIR}" pwd-check >/dev/null 2>&1; then
            echo "[FAIL] Unix wrapper failed to block -C targeting primary repo!" >&2; exit 1
          fi
          if CODEX_TEST_SENTINEL="${EXEC_SENTINEL}" "${LOCAL_BIN}/codex" --cd="${REPO_DIR}/src/sub dir" pwd-check >/dev/null 2>&1; then
            echo "[FAIL] Unix wrapper failed to block --cd= targeting primary subdir!" >&2; exit 1
          fi
          if CODEX_TEST_SENTINEL="${EXEC_SENTINEL}" "${LOCAL_BIN}/codex" --add-dir "${REPO_DIR}" pwd-check >/dev/null 2>&1; then
            echo "[FAIL] Unix wrapper failed to block --add-dir targeting primary repo!" >&2; exit 1
          fi
          if CODEX_TEST_SENTINEL="${EXEC_SENTINEL}" "${LOCAL_BIN}/codex" "-C${REPO_DIR}" pwd-check >/dev/null 2>&1; then
            echo "[FAIL] Unix wrapper failed to block attached -C<primary> targeting primary repo!" >&2; exit 1
          fi
          [ ! -e "${EXEC_SENTINEL}" ] || { echo "[FAIL] Blocked -C/--cd/--add-dir still executed fake codex!" >&2; exit 1; }

          # Regression: CODEX_NO_AUTO_WORKTREE_CD=1 skips auto-cd, STILL blocks -C/--cd/--add-dir fail-closed.
          NO_AUTO_CWD="$(cd "${REPO_DIR}/src/sub dir" && CODEX_NO_AUTO_WORKTREE_CD=1 "${LOCAL_BIN}/codex" pwd-check)"
          case "${NO_AUTO_CWD}" in
            */my\ repo/src/sub\ dir) ;;
            *) echo "[FAIL] Expected primary repo subdir with CODEX_NO_AUTO_WORKTREE_CD=1, got ${NO_AUTO_CWD}" >&2; exit 1 ;;
          esac
          rm -f "${EXEC_SENTINEL}"
          if CODEX_NO_AUTO_WORKTREE_CD=1 CODEX_TEST_SENTINEL="${EXEC_SENTINEL}" "${LOCAL_BIN}/codex" -C "${REPO_DIR}" pwd-check >/dev/null 2>&1; then
            echo "[FAIL] CODEX_NO_AUTO_WORKTREE_CD=1 must NOT bypass -C argument block!" >&2; exit 1
          fi
          if CODEX_NO_AUTO_WORKTREE_CD=1 CODEX_TEST_SENTINEL="${EXEC_SENTINEL}" "${LOCAL_BIN}/codex" --cd="${REPO_DIR}/src/sub dir" pwd-check >/dev/null 2>&1; then
            echo "[FAIL] CODEX_NO_AUTO_WORKTREE_CD=1 must NOT bypass --cd= argument block!" >&2; exit 1
          fi
          if CODEX_NO_AUTO_WORKTREE_CD=1 CODEX_TEST_SENTINEL="${EXEC_SENTINEL}" "${LOCAL_BIN}/codex" --add-dir "${REPO_DIR}" pwd-check >/dev/null 2>&1; then
            echo "[FAIL] CODEX_NO_AUTO_WORKTREE_CD=1 must NOT bypass --add-dir argument block!" >&2; exit 1
          fi
          [ ! -e "${EXEC_SENTINEL}" ] || { echo "[FAIL] CODEX_NO_AUTO_WORKTREE_CD=1 executed fake codex on blocked arg!" >&2; exit 1; }

          # Hard Fail-Closed Worktree Regression A: Missing/deleted worktree (WITHOUT CODEX_NO_AUTO_WORKTREE_CD)
          # MUST FAIL CLOSED (rc != 0, error explains refusal to fall back to primary repo, fake codex NOT executed!).
          mv "${REPO_DIR}-lane2" "${REPO_DIR}-lane2-bak"
          rm -f "${EXEC_SENTINEL}"
          set +e
          MISSING_WT_ERR="$(cd "${REPO_DIR}/src/sub dir" && CODEX_TEST_SENTINEL="${EXEC_SENTINEL}" "${LOCAL_BIN}/codex" pwd-check 2>&1)"
          MISSING_WT_RC=$?
          set -e
          if [ "${MISSING_WT_RC}" -eq 0 ]; then
            echo "[FAIL] Deleted worktree MUST fail closed (expected non-zero exit, got 0): ${MISSING_WT_ERR}" >&2; exit 1
          fi
          printf '%s\n' "${MISSING_WT_ERR}" | grep -Eq 'refusing to fall back to primary repo'
          [ ! -e "${EXEC_SENTINEL}" ] || { echo "[FAIL] Deleted worktree still executed fake codex!" >&2; exit 1; }

          # Hard Fail-Closed Worktree Regression B: Worktree path replaced by a regular file -> MUST FAIL CLOSED!
          printf 'not-a-directory\n' > "${REPO_DIR}-lane2"
          rm -f "${EXEC_SENTINEL}"
          set +e
          FILE_WT_ERR="$(cd "${REPO_DIR}/src/sub dir" && CODEX_TEST_SENTINEL="${EXEC_SENTINEL}" "${LOCAL_BIN}/codex" pwd-check 2>&1)"
          FILE_WT_RC=$?
          set -e
          rm -f "${REPO_DIR}-lane2"
          mv "${REPO_DIR}-lane2-bak" "${REPO_DIR}-lane2"
          if [ "${FILE_WT_RC}" -eq 0 ]; then
            echo "[FAIL] Regular-file worktree path MUST fail closed (expected non-zero exit, got 0): ${FILE_WT_ERR}" >&2; exit 1
          fi
          printf '%s\n' "${FILE_WT_ERR}" | grep -Eq 'refusing to fall back to primary repo'
          [ ! -e "${EXEC_SENTINEL}" ] || { echo "[FAIL] Regular-file worktree still executed fake codex!" >&2; exit 1; }

          # Hard Fail-Closed Worktree Regression C: Unreadable worktree dir / subdir where `cd` fails -> MUST FAIL CLOSED!
          if [ "$(id -u)" -ne 0 ] && ! uname -s | grep -Eqi 'mingw|msys|cygwin'; then
            chmod 000 "${REPO_DIR}-lane2"
            rm -f "${EXEC_SENTINEL}"
            set +e
            CDFAIL_ROOT_ERR="$(cd "${REPO_DIR}/src/sub dir" && CODEX_TEST_SENTINEL="${EXEC_SENTINEL}" "${LOCAL_BIN}/codex" pwd-check 2>&1)"
            CDFAIL_ROOT_RC=$?
            set -e
            chmod 755 "${REPO_DIR}-lane2"
            if [ "${CDFAIL_ROOT_RC}" -eq 0 ]; then
              echo "[FAIL] Unreadable worktree root (cd failed) MUST fail closed: ${CDFAIL_ROOT_ERR}" >&2; exit 1
            fi
            printf '%s\n' "${CDFAIL_ROOT_ERR}" | grep -Eq 'cd failed|refusing to fall back'
            [ ! -e "${EXEC_SENTINEL}" ] || { echo "[FAIL] Unreadable worktree root still executed fake codex!" >&2; exit 1; }

            chmod 000 "${REPO_DIR}-lane2/src/sub dir"
            rm -f "${EXEC_SENTINEL}"
            set +e
            CDFAIL_SUB_ERR="$(cd "${REPO_DIR}/src/sub dir" && CODEX_TEST_SENTINEL="${EXEC_SENTINEL}" "${LOCAL_BIN}/codex" pwd-check 2>&1)"
            CDFAIL_SUB_RC=$?
            set -e
            chmod 755 "${REPO_DIR}-lane2/src/sub dir"
            if [ "${CDFAIL_SUB_RC}" -eq 0 ]; then
              echo "[FAIL] Unreadable worktree subdir (cd failed) MUST fail closed: ${CDFAIL_SUB_ERR}" >&2; exit 1
            fi
            printf '%s\n' "${CDFAIL_SUB_ERR}" | grep -Eq 'cd failed|refusing to remain in primary repo'
            [ ! -e "${EXEC_SENTINEL}" ] || { echo "[FAIL] Unreadable worktree subdir still executed fake codex!" >&2; exit 1; }
          fi

          # 3) doctor.sh passes and never echoes auth secret canary.
          DOC_OUT="$(
            PATH="${LOCAL_BIN}:${FAKE_BIN}:${PATH}" \
            CODEX_LANE1_HOME="${LANE1}" \
            CODEX_LANE2_HOME="${LANE2}" \
            CODEX_LOCAL_BIN="${LOCAL_BIN}" \
            ./scripts/doctor.sh
          )"
          printf '%s\n' "${DOC_OUT}"
          if printf '%s' "${DOC_OUT}" | grep -Fq "${SECRET_CANARY}"; then
            echo "[FAIL] doctor.sh leaked auth.json secret canary!" >&2
            exit 1
          fi

          # 4) Adversarial manifests (path traversal AND invalid/SUID mode 4755) fail closed with zero side effects.
          BAD_SNAP="${TMP_ROOT}/bad-traversal.tsv"
          printf '# schema=1\n0\t-\t%s/../outside_victim.txt\t-\t-\n' "${LANE2}" > "${BAD_SNAP}"
          set +e
          TRAV_ERR="$(
            CODEX_LANE1_HOME="${LANE1}" \
            CODEX_LANE2_HOME="${LANE2}" \
            CODEX_LOCAL_BIN="${LOCAL_BIN}" \
            ./scripts/restore-original.sh --snapshot "${BAD_SNAP}" 2>&1
          )"
          TRAV_RC=$?
          set -e
          if [ "${TRAV_RC}" -eq 0 ]; then
            echo "[FAIL] restore-original.sh accepted path-traversal manifest!" >&2
            exit 1
          fi
          printf '%s\n' "${TRAV_ERR}" | grep -Eq 'Security violation|traversal'
          [ -f "${OUTSIDE_VICTIM}" ]
          [ "$(sha256_of "${OUTSIDE_VICTIM}")" = "${VICTIM_HASH}" ]
          [ -L "${LANE2}/sessions" ]

          BAD_MODE_SNAP="${TMP_ROOT}/bad-mode.tsv"
          printf '# schema=1\n1\t%s\t%s/config.toml\t%s/config.toml\t4755\n' "${ORIG_HASH}" "${LANE2}" "${LANE2}" > "${BAD_MODE_SNAP}"
          if CODEX_LANE1_HOME="${LANE1}" CODEX_LANE2_HOME="${LANE2}" CODEX_LOCAL_BIN="${LOCAL_BIN}" \
             ./scripts/restore-original.sh --snapshot "${BAD_MODE_SNAP}" >/dev/null 2>&1; then
            echo "[FAIL] restore-original.sh accepted SUID mode 4755 in manifest!" >&2
            exit 1
          fi

          # 5) restore-original.sh --dry-run must perform zero mutations.
          PRE_RESTORE_HASH="$(sha256_of "${LANE2}/config.toml")"
          CODEX_LANE1_HOME="${LANE1}" \
          CODEX_LANE2_HOME="${LANE2}" \
          CODEX_LOCAL_BIN="${LOCAL_BIN}" \
          ./scripts/restore-original.sh --dry-run
          [ "$(sha256_of "${LANE2}/config.toml")" = "${PRE_RESTORE_HASH}" ]
          [ -L "${LANE2}/sessions" ]

          # 6) Real deterministic rollback restores exact SHA-256 AND exact pre-existing POSIX modes (0755 & 0644).
          CODEX_LANE1_HOME="${LANE1}" \
          CODEX_LANE2_HOME="${LANE2}" \
          CODEX_LOCAL_BIN="${LOCAL_BIN}" \
          ./scripts/restore-original.sh
          RESTORED_HASH="$(sha256_of "${LANE2}/config.toml")"
          [ "${ORIG_HASH}" = "${RESTORED_HASH}" ]
          python3 -B -c 'import os, stat, sys; assert stat.S_IMODE(os.stat(sys.argv[1]).st_mode) == 0o644' "${LANE2}/config.toml"
          [ ! -L "${LANE2}/sessions" ]
          [ ! -e "${LOCAL_BIN}/codex" ]
          [ ! -e "${LOCAL_BIN}/codex-official" ]
          [ ! -e "${LOCAL_BIN}/codex-manage" ]
          [ -x "${LOCAL_BIN}/codex-t3" ]
          [ "$(sha256_of "${LOCAL_BIN}/codex-t3")" = "${ORIG_LAUNCHER_HASH}" ]
          python3 -B -c 'import os, stat, sys; assert stat.S_IMODE(os.stat(sys.argv[1]).st_mode) == 0o755' "${LOCAL_BIN}/codex-t3"
          [ -f "${LANE1}/sessions/keep.jsonl" ]
          [ "$(sha256_of "${LANE1}/sessions/keep.jsonl")" = "${SESSION_HASH}" ]

          # 7) Interrupted Mid-Install Rollback Recovery (Unix):
          #    7a) Mid-Step-5 interruption with partial symlinks (3/6 symlinks created before abort)
          #    7b) Mid-Step-8 interruption with partial files + 6/6 symlinks + backed-up pre-existing codex
          #        + untouched pre-existing codex-t3
          INT_DIR="${TMP_ROOT}/interrupted workspace"
          INT_REPO="${INT_DIR}/repo"
          INT_L1="${INT_DIR}/lane1"
          INT_L2="${INT_DIR}/lane2"
          INT_BIN="${INT_DIR}/local bin"
          mkdir -p "${INT_REPO}" "${INT_L1}/sessions" "${INT_L2}" "${INT_BIN}"
          echo '{"id":"int-keep"}' > "${INT_L1}/sessions/keep.jsonl"
          INT_SESS_HASH="$(sha256_of "${INT_L1}/sessions/keep.jsonl")"
          printf 'model = "int-orig-model"\n' > "${INT_L2}/config.toml"
          chmod 644 "${INT_L2}/config.toml"
          INT_CFG_HASH="$(sha256_of "${INT_L2}/config.toml")"
          printf '#!/usr/bin/env bash\necho PRE_EXISTING_CODEX\n' > "${INT_BIN}/codex"
          chmod 755 "${INT_BIN}/codex"
          INT_CODEX_HASH="$(sha256_of "${INT_BIN}/codex")"
          printf '#!/usr/bin/env bash\necho PRE_EXISTING_T3\n' > "${INT_BIN}/codex-t3"
          chmod 755 "${INT_BIN}/codex-t3"
          INT_T3_HASH="$(sha256_of "${INT_BIN}/codex-t3")"

          # 7a) Plant a regular file at INT_L1/archived_sessions so Step 5 aborts after 3/6 symlinks.
          printf 'blocker-file\n' > "${INT_L1}/archived_sessions"
          set +e
          PATH="${FAKE_BIN}:${PATH}" CODEX_LANE1_HOME="${INT_L1}" CODEX_LANE2_HOME="${INT_L2}" CODEX_LOCAL_BIN="${INT_BIN}" \
            ./scripts/setup-dual-lane.sh --repo "${INT_REPO}" >/dev/null 2>&1
          INT5_RC=$?
          set -e
          [ "${INT5_RC}" -ne 0 ] || { echo "[FAIL] Step 5 interruption did not abort!" >&2; exit 1; }
          [ -f "${INT_L2}/.rollback/latest.tsv" ]
          grep -q '^# status=in-progress$' "${INT_L2}/.rollback/latest.tsv"
          [ -L "${INT_L2}/sessions" ]
          [ ! -L "${INT_L2}/plugins" ]
          rm -f "${INT_L1}/archived_sessions"
          CODEX_LANE1_HOME="${INT_L1}" CODEX_LANE2_HOME="${INT_L2}" CODEX_LOCAL_BIN="${INT_BIN}" \
            ./scripts/restore-original.sh
          for d in memories memories_v2 sessions archived_sessions skills plugins; do
            [ ! -L "${INT_L2}/${d}" ] || { echo "[FAIL] Orphaned symlink ${d} after Step 5 rollback!" >&2; exit 1; }
          done
          [ "$(sha256_of "${INT_L1}/sessions/keep.jsonl")" = "${INT_SESS_HASH}" ]
          [ "$(sha256_of "${INT_L2}/config.toml")" = "${INT_CFG_HASH}" ]
          [ "$(sha256_of "${INT_BIN}/codex")" = "${INT_CODEX_HASH}" ]
          [ "$(sha256_of "${INT_BIN}/codex-t3")" = "${INT_T3_HASH}" ]

          # 7b) Plant a blocker directory at INT_BIN/codex-official so Step 8 aborts AFTER backing up
          #     & overwriting pre-existing codex, config.toml, rules, AGENTS.md, and all 6 symlinks,
          #     while leaving pre-existing codex-t3 untouched.
          mkdir -p "${INT_BIN}/codex-official"
          set +e
          PATH="${FAKE_BIN}:${PATH}" CODEX_LANE1_HOME="${INT_L1}" CODEX_LANE2_HOME="${INT_L2}" CODEX_LOCAL_BIN="${INT_BIN}" \
            ./scripts/setup-dual-lane.sh --repo "${INT_REPO}" >/dev/null 2>&1
          INT8_RC=$?
          set -e
          [ "${INT8_RC}" -ne 0 ] || { echo "[FAIL] Step 8 interruption did not abort!" >&2; exit 1; }
          rmdir "${INT_BIN}/codex-official"
          [ -f "${INT_L2}/.rollback/latest.tsv" ]
          grep -q '^# status=in-progress$' "${INT_L2}/.rollback/latest.tsv"
          CODEX_LANE1_HOME="${INT_L1}" CODEX_LANE2_HOME="${INT_L2}" CODEX_LOCAL_BIN="${INT_BIN}" \
            ./scripts/restore-original.sh
          [ "$(sha256_of "${INT_L2}/config.toml")" = "${INT_CFG_HASH}" ]
          python3 -B -c 'import os, stat, sys; assert stat.S_IMODE(os.stat(sys.argv[1]).st_mode) == 0o644' "${INT_L2}/config.toml"
          [ "$(sha256_of "${INT_BIN}/codex")" = "${INT_CODEX_HASH}" ]
          python3 -B -c 'import os, stat, sys; assert stat.S_IMODE(os.stat(sys.argv[1]).st_mode) == 0o755' "${INT_BIN}/codex"
          [ "$(sha256_of "${INT_BIN}/codex-t3")" = "${INT_T3_HASH}" ]
          python3 -B -c 'import os, stat, sys; assert stat.S_IMODE(os.stat(sys.argv[1]).st_mode) == 0o755' "${INT_BIN}/codex-t3"
          [ ! -e "${INT_L2}/AGENTS.md" ]
          [ ! -e "${INT_L2}/rules/default.rules" ]
          for d in memories memories_v2 sessions archived_sessions skills plugins; do
            [ ! -L "${INT_L2}/${d}" ] || { echo "[FAIL] Orphaned symlink ${d} after Step 8 rollback!" >&2; exit 1; }
          done
          [ "$(sha256_of "${INT_L1}/sessions/keep.jsonl")" = "${INT_SESS_HASH}" ]

          # 8) Repeated Install + Rollback Loop (3x consecutive cycles on Unix):
          #    Install -> Verify -> Restore -> Verify byte-exact original state & POSIX modes 3 times.
          for cycle in 1 2 3; do
            PATH="${FAKE_BIN}:${PATH}" \
            CODEX_LANE1_HOME="${LANE1}" \
            CODEX_LANE2_HOME="${LANE2}" \
            CODEX_LOCAL_BIN="${LOCAL_BIN}" \
            ./scripts/setup-dual-lane.sh --repo "${REPO_DIR}" --use-git-worktree --install-bridge
            grep -q 'approval_policy = "on-request"' "${LANE2}/config.toml"
            grep -q 'model = "custom-ci-model"' "${LANE2}/config.toml"
            grep -q '^# status=complete$' "${LANE2}/.rollback/latest.tsv"
            [ -x "${LOCAL_BIN}/codex-manage" ]
            python3 -B -c 'import os, stat, sys; assert stat.S_IMODE(os.stat(sys.argv[1]).st_mode) == 0o600' "${LANE2}/config.toml"
            for d in memories memories_v2 sessions archived_sessions skills plugins; do
              [ -L "${LANE2}/${d}" ] || { echo "[FAIL] Cycle ${cycle}: missing symlink ${d}!" >&2; exit 1; }
            done

            CODEX_LANE1_HOME="${LANE1}" \
            CODEX_LANE2_HOME="${LANE2}" \
            CODEX_LOCAL_BIN="${LOCAL_BIN}" \
            ./scripts/restore-original.sh
            [ "$(sha256_of "${LANE2}/config.toml")" = "${ORIG_HASH}" ]
            python3 -B -c 'import os, stat, sys; assert stat.S_IMODE(os.stat(sys.argv[1]).st_mode) == 0o644' "${LANE2}/config.toml"
            [ "$(sha256_of "${LOCAL_BIN}/codex-t3")" = "${ORIG_LAUNCHER_HASH}" ]
            python3 -B -c 'import os, stat, sys; assert stat.S_IMODE(os.stat(sys.argv[1]).st_mode) == 0o755' "${LOCAL_BIN}/codex-t3"
            [ ! -e "${LOCAL_BIN}/codex" ]
            [ ! -e "${LOCAL_BIN}/codex-official" ]
            [ ! -e "${LOCAL_BIN}/codex-manage" ]
            [ ! -e "${LANE2}/AGENTS.md" ]
            [ ! -e "${LANE2}/rules/default.rules" ]
            for d in memories memories_v2 sessions archived_sessions skills plugins; do
              [ ! -L "${LANE2}/${d}" ] || { echo "[FAIL] Cycle ${cycle}: orphaned symlink ${d}!" >&2; exit 1; }
            done
            [ -z "$(find "${LANE1}" "${LANE2}" "${LOCAL_BIN}" -maxdepth 2 -name '*.backup-*' 2>/dev/null)" ] || {
              echo "[FAIL] Cycle ${cycle}: stray .backup-* file left behind after rollback!" >&2; exit 1
            }
            [ "$(sha256_of "${LANE1}/sessions/keep.jsonl")" = "${SESSION_HASH}" ]
          done

          # 9) v1.3.1 Rollback Invariants: Pre-existing symlink preservation, exact dir-backup
          #    restoration (decoy-proof), fail-closed missing-backup preflight, and idempotent re-run.
          P9_L1="${WORK_DIR}/p9 lane 1"
          P9_L2="${WORK_DIR}/p9 lane 2"
          P9_BIN="${WORK_DIR}/p9 local bin"
          P9_REPO="${WORK_DIR}/p9 repo"
          P9_CUSTOM="${WORK_DIR}/p9 user skills"
          mkdir -p "${P9_L1}/sessions" "${P9_L2}/memories" "${P9_L2}/memories.backup-99999999-999999" "${P9_BIN}" "${P9_REPO}" "${P9_CUSTOM}"
          P9_L2_CANON="$(cd -P -- "${P9_L2}" && pwd -P)"
          printf 'KEEP_USER_SKILLS_LINK\n' > "${P9_CUSTOM}/user_skill.txt"
          ln -s -- "${P9_CUSTOM}" "${P9_L2}/skills"
          printf 'REAL_ORIGINAL_MEMORIES\n' > "${P9_L2}/memories/marker.txt"
          printf 'WRONG_DECOY_BACKUP\n' > "${P9_L2}/memories.backup-99999999-999999/marker.txt"
          printf 'model = "p9-original"\n' > "${P9_L2}/config.toml"
          chmod 644 "${P9_L2}/config.toml"
          P9_CFG_HASH="$(sha256_of "${P9_L2}/config.toml")"

          PATH="${FAKE_BIN}:${PATH}" CODEX_LANE1_HOME="${P9_L1}" CODEX_LANE2_HOME="${P9_L2}" CODEX_LOCAL_BIN="${P9_BIN}" \
            ./scripts/setup-dual-lane.sh --repo "${P9_REPO}"
          grep -q '^# schema_version=2$' "${P9_L2}/.rollback/latest.tsv"
          grep -Fq $'L\t0\t'"${P9_L2_CANON}/skills"$'\t-\tpreexisting_link' "${P9_L2}/.rollback/latest.tsv"

          P9_CFG_BKP="$(awk -F'\t' '$1=="1" && $3 ~ /p9 lane 2\/config\.toml$/ {print $4; exit}' "${P9_L2}/.rollback/latest.tsv")"
          P9_MEM_BKP="$(awk -F'\t' '$1=="L" && $5=="preexisting_dir" && $3 ~ /p9 lane 2\/memories$/ {print $4; exit}' "${P9_L2}/.rollback/latest.tsv")"
          [ -f "${P9_CFG_BKP}" ]
          [ -d "${P9_MEM_BKP}" ]
          [ "${P9_MEM_BKP}" != "${P9_L2_CANON}/memories.backup-99999999-999999" ]

          # 9a) Missing FILE backup MUST fail closed BEFORE Step 1 unlinks any symlinks!
          mv -- "${P9_CFG_BKP}" "${WORK_DIR}/p9-held-cfg-bkp"
          set +e
          CODEX_LANE1_HOME="${P9_L1}" CODEX_LANE2_HOME="${P9_L2}" CODEX_LOCAL_BIN="${P9_BIN}" \
            ./scripts/restore-original.sh >/dev/null 2>&1
          P9_MISS_FILE_RC=$?
          set -e
          mv -- "${WORK_DIR}/p9-held-cfg-bkp" "${P9_CFG_BKP}"
          [ "${P9_MISS_FILE_RC}" -ne 0 ] || { echo "[FAIL] Missing file backup exited 0!" >&2; exit 1; }
          [ -L "${P9_L2}/sessions" ] || { echo "[FAIL] ZERO-SIDE-EFFECT VIOLATION: sessions symlink unlinked despite missing file backup!" >&2; exit 1; }
          [ -L "${P9_L2}/memories" ] || { echo "[FAIL] ZERO-SIDE-EFFECT VIOLATION: memories symlink unlinked despite missing file backup!" >&2; exit 1; }
          [ -f "${P9_BIN}/codex" ] || { echo "[FAIL] ZERO-SIDE-EFFECT VIOLATION: codex wrapper removed despite missing file backup!" >&2; exit 1; }

          # 9b) Missing DIRECTORY backup MUST fail closed BEFORE Step 1 unlinks any symlinks!
          mv -- "${P9_MEM_BKP}" "${WORK_DIR}/p9-held-mem-bkp"
          set +e
          CODEX_LANE1_HOME="${P9_L1}" CODEX_LANE2_HOME="${P9_L2}" CODEX_LOCAL_BIN="${P9_BIN}" \
            ./scripts/restore-original.sh >/dev/null 2>&1
          P9_MISS_DIR_RC=$?
          set -e
          mv -- "${WORK_DIR}/p9-held-mem-bkp" "${P9_MEM_BKP}"
          [ "${P9_MISS_DIR_RC}" -ne 0 ] || { echo "[FAIL] Missing dir backup exited 0!" >&2; exit 1; }
          [ -L "${P9_L2}/sessions" ] || { echo "[FAIL] ZERO-SIDE-EFFECT VIOLATION: sessions symlink unlinked despite missing dir backup!" >&2; exit 1; }
          [ -f "${P9_BIN}/codex" ] || { echo "[FAIL] ZERO-SIDE-EFFECT VIOLATION: codex wrapper removed despite missing dir backup!" >&2; exit 1; }

          # 9c) Full restore: preserves pre-existing skills symlink, restores EXACT memories dir (ignoring decoy),
          #     detaches kit-created symlinks, and passes idempotent 2nd restore cleanly!
          CODEX_LANE1_HOME="${P9_L1}" CODEX_LANE2_HOME="${P9_L2}" CODEX_LOCAL_BIN="${P9_BIN}" \
            ./scripts/restore-original.sh
          [ -L "${P9_L2}/skills" ] || { echo "[FAIL] REGRESSION: Pre-existing skills symlink was unlinked!" >&2; exit 1; }
          [ "$(readlink "${P9_L2}/skills")" = "${P9_CUSTOM}" ] || { echo "[FAIL] Pre-existing skills symlink target altered!" >&2; exit 1; }
          for d in memories_v2 sessions archived_sessions plugins; do
            [ ! -L "${P9_L2}/${d}" ] || { echo "[FAIL] Kit-created symlink ${d} was not unlinked!" >&2; exit 1; }
          done
          [ -d "${P9_L2}/memories" ] && [ ! -L "${P9_L2}/memories" ]
          [ "$(cat "${P9_L2}/memories/marker.txt")" = "REAL_ORIGINAL_MEMORIES" ] || { echo "[FAIL] Wrong dir backup restored!" >&2; exit 1; }
          [ "$(cat "${P9_L2}/memories.backup-99999999-999999/marker.txt")" = "WRONG_DECOY_BACKUP" ]
          [ "$(sha256_of "${P9_L2}/config.toml")" = "${P9_CFG_HASH}" ]
          python3 -B -c 'import os, stat, sys; assert stat.S_IMODE(os.stat(sys.argv[1]).st_mode) == 0o644' "${P9_L2}/config.toml"

          # 9d) Idempotent 2nd restore succeeds cleanly with backups already consumed.
          CODEX_LANE1_HOME="${P9_L1}" CODEX_LANE2_HOME="${P9_L2}" CODEX_LOCAL_BIN="${P9_BIN}" \
            ./scripts/restore-original.sh
          [ -L "${P9_L2}/skills" ]

          # 9e) v1.3.3 Security Trust-Boundary Parity, Zero-Intrusion Desktop Harvesting & Auth-Share Guardrails:
          #     Desktop (Lane 1) = Primary Account (untouched config.toml + auth.json, full authority)
          #     + CLI (Lane 2) = read-only harvests [projects.*] strictly preserving trust_level
          #       (trusted stays trusted, untrusted stays untrusted, missing/invalid trust_level is NEVER
          #       harvested/promoted, pre-existing Lane 2 untrusted entries are NEVER overwritten or
          #       duplicated across quote/trailing-slash variants), emits explicit opt-in & third-party
          #       gateway [WARN] guardrails for --share-auth-to-lane2, configures CLI gateway via
          #       --configure-cli-gateway / --cli-api-key-env, and resolves relative --repo-path .
          cat > "${P9_L1}/config.toml" <<'EOF'
          # Desktop primary account config
          model = "desktop-primary"

          [projects."/tmp/desktop-trusted-proj"]
          trust_level = "trusted"

          [projects."/tmp/desktop-untrusted-proj"]
          trust_level = "untrusted"

          [projects."/tmp/desktop-no-trust-proj"]
          # intentionally missing trust_level

          [projects."/tmp/desktop-invalid-trust-proj"]
          trust_level = "unknown"

          [projects."/tmp/lane2-preexisting-untrusted/"]
          trust_level = "trusted"
          EOF
          chmod 600 "${P9_L1}/config.toml"
          P9_L1_CFG_HASH="$(sha256_of "${P9_L1}/config.toml")"
          printf '{"auth_mode":"chatgpt","token":"%s"}\n' "${SECRET_CANARY}" > "${P9_L1}/auth.json"
          chmod 600 "${P9_L1}/auth.json"
          P9_L1_AUTH_HASH="$(sha256_of "${P9_L1}/auth.json")"
          cat > "${P9_L2}/config.toml" <<'EOF'
          model = "p9-original"

          [projects.'/tmp/lane2-preexisting-untrusted']
          trust_level = "untrusted"
          EOF
          chmod 644 "${P9_L2}/config.toml"
          P9E_ORIG_CFG_HASH="$(sha256_of "${P9_L2}/config.toml")"
          rm -f "${P9_L2}/auth.json"
          P9_REPO_CANON="$(cd -P -- "${P9_REPO}" && pwd -P)"
          KIT_ROOT_ABS="$(pwd -P)"

          # Confirm --share-auth-to-lane2 is strictly opt-in (default off: no auth copy or warning without flag).
          P9E_OPTIN_OUT="$(
            cd "${P9_REPO}"
            PATH="${FAKE_BIN}:${PATH}" CODEX_LANE1_HOME="${P9_L1}" CODEX_LANE2_HOME="${P9_L2}" CODEX_LOCAL_BIN="${P9_BIN}" \
              "${KIT_ROOT_ABS}/scripts/setup-dual-lane.sh" --repo-path . --dry-run 2>&1
          )"
          if printf '%s\n' "${P9E_OPTIN_OUT}" | grep -Fq -- '--share-auth-to-lane2'; then
            echo "[FAIL] --share-auth-to-lane2 warning fired even though flag was not passed!" >&2
            exit 1
          fi
          [ ! -e "${P9_L2}/auth.json" ]

          P9E_SETUP_OUT="$(
            cd "${P9_REPO}"
            PATH="${FAKE_BIN}:${PATH}" CODEX_LANE1_HOME="${P9_L1}" CODEX_LANE2_HOME="${P9_L2}" CODEX_LOCAL_BIN="${P9_BIN}" \
              "${KIT_ROOT_ABS}/scripts/setup-dual-lane.sh" --repo-path . \
                --configure-cli-gateway \
                --gateway-base-url "https://gateway.example.invalid/v1" \
                --cli-api-key-env "CODEX_CLI_API_KEY" \
                --share-auth-to-lane2 2>&1
          )"
          printf '%s\n' "${P9E_SETUP_OUT}"
          printf '%s\n' "${P9E_SETUP_OUT}" | grep -Fq '[WARN] --share-auth-to-lane2'
          printf '%s\n' "${P9E_SETUP_OUT}" | grep -Eqi '\[WARN\].*third-party API gateway'
          if printf '%s' "${P9E_SETUP_OUT}" | grep -Fq "${SECRET_CANARY}"; then
            echo "[FAIL] setup-dual-lane.sh leaked auth.json secret canary in 9e!" >&2
            exit 1
          fi

          # Lane 1 config.toml and auth.json MUST remain 100% untouched (Desktop full native authority).
          [ "$(sha256_of "${P9_L1}/config.toml")" = "${P9_L1_CFG_HASH}" ]
          [ "$(sha256_of "${P9_L1}/auth.json")" = "${P9_L1_AUTH_HASH}" ]
          # Lane 2 config.toml MUST be valid TOML (no duplicate project tables), preserve trust boundaries
          # strictly across Lane 1 & Lane 2, keep env_key + preserved model + canonicalized --repo-path .
          # + zero plaintext secrets, coexisting with harvested auth.json (0600).
          grep -Fq 'model_provider = "OpenAI"' "${P9_L2}/config.toml"
          grep -Fq 'env_key = "CODEX_CLI_API_KEY"' "${P9_L2}/config.toml"
          grep -Fq 'model = "p9-original"' "${P9_L2}/config.toml"
          grep -Fq '[projects."/tmp/desktop-trusted-proj"]' "${P9_L2}/config.toml"
          grep -Fq '[projects."/tmp/desktop-untrusted-proj"]' "${P9_L2}/config.toml"
          # SECURITY: without --trust-repo-path the target repo must NOT be auto-trusted.
          ! grep -Fq "[projects.\"${P9_REPO_CANON}\"]" "${P9_L2}/config.toml"
          ! grep -Fq '/tmp/desktop-no-trust-proj' "${P9_L2}/config.toml"
          ! grep -Fq '/tmp/desktop-invalid-trust-proj' "${P9_L2}/config.toml"
          ! grep -Eq '^[[:space:]]*(api_key|experimental_bearer_token)[[:space:]]*=' "${P9_L2}/config.toml"
